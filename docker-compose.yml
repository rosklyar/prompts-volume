services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prompts-postgres
    environment:
      POSTGRES_DB: prompts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: prompts-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prompts
      USERS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/users
      EVALS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/evals
      DATAFORSEO_USERNAME: ${DATAFORSEO_USERNAME}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TOPICS_PROVIDER_SIMILARITY_THRESHOLD: 0.8
      SECRET_KEY: ${SECRET_KEY:-changethis}
      FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@example.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-changethis}
      FIRST_REGULAR_USER_EMAIL: ${FIRST_REGULAR_USER_EMAIL:-user@example.com}
      FIRST_REGULAR_USER_PASSWORD: ${FIRST_REGULAR_USER_PASSWORD:-changethis}
      FRONTEND_URL: http://localhost:5173
      EVALUATION_API_TOKENS: ${EVALUATION_API_TOKENS}
      BREVO_API_KEY: ${BREVO_API_KEY}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_GSC_CLIENT_ID: ${GOOGLE_GSC_CLIENT_ID}
      GOOGLE_GSC_CLIENT_SECRET: ${GOOGLE_GSC_CLIENT_SECRET}
      GOOGLE_GSC_REDIRECT_URI: ${GOOGLE_GSC_REDIRECT_URI:-http://localhost:8000/api/v1/gsc/auth/callback}
      GSC_TOKEN_ENCRYPTION_KEY: ${GSC_TOKEN_ENCRYPTION_KEY}
      SEED_DATA: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 30s
      start_period: 5s
      retries: 3

volumes:
  postgres_data:
